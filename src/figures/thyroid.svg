<svg viewBox="-40 0 460 270" role="img" aria-label="示意图：猫的正面，脖子上气管两边各有一个甲状腺。甲亢时超过 70% 的病例两个都变大" xmlns="http://www.w3.org/2000/svg">
  <!-- 脖子和头 -->
  <path d="M174 160 L166 262 L254 262 L246 160 Z" style="fill: var(--s-todo)" />
  <g style="fill: var(--s-todo)">
    <path d="M142 86 L148 24 L186 60 Z" />
    <path d="M234 60 L272 24 L278 86 Z" />
    <ellipse cx="210" cy="116" rx="82" ry="66" />
  </g>
  <path d="M164 104 Q178 92 192 104 Q178 112 164 104 Z" style="fill: var(--ink)" />
  <path d="M228 104 Q242 92 256 104 Q242 112 228 104 Z" style="fill: var(--ink)" />
  <path d="M200 132 L220 132 L210 143 Z" style="fill: var(--pad)" />
  <path d="M210 143 L210 150 M210 150 Q202 158 194 152 M210 150 Q218 158 226 152" style="fill: none; stroke: var(--ink-2); stroke-width: 1.4; stroke-linecap: round" />

  <!-- 气管：脖子正中 -->
  <rect x="202" y="184" width="16" height="78" rx="6" style="fill: var(--surface); stroke: var(--ink-2); stroke-width: 1" />
  <g style="stroke: var(--ink-2); stroke-width: 1">
    <line x1="203" y1="196" x2="217" y2="196" />
    <line x1="203" y1="208" x2="217" y2="208" />
    <line x1="203" y1="220" x2="217" y2="220" />
    <line x1="203" y1="232" x2="217" y2="232" />
    <line x1="203" y1="244" x2="217" y2="244" />
  </g>

  <!-- 两个甲状腺，变大了 -->
  <ellipse cx="190" cy="214" rx="9" ry="18" style="fill: var(--pad); stroke: var(--ink); stroke-width: 1.2" />
  <ellipse cx="230" cy="214" rx="9" ry="18" style="fill: var(--pad); stroke: var(--ink); stroke-width: 1.2" />

  <!-- 标注 -->
  <line x1="182" y1="214" x2="100" y2="214" style="stroke: var(--ink); stroke-width: 1.2" />
  <text x="94" y="208" text-anchor="end" style="fill: var(--ink); font-size: 15px; font-weight: 600">甲状腺</text>
  <text x="94" y="226" text-anchor="end" style="fill: var(--ink-2); font-size: 13px">脖子上，左右各一个</text>

  <line x1="238" y1="214" x2="306" y2="214" style="stroke: var(--ink); stroke-width: 1.2" />
  <text x="312" y="208" style="fill: var(--ink); font-size: 15px; font-weight: 600">甲亢时</text>
  <text x="312" y="226" style="fill: var(--ink-2); font-size: 13px">超过 70%</text>
  <text x="312" y="242" style="fill: var(--ink-2); font-size: 13px">两个都变大</text>
</svg>
