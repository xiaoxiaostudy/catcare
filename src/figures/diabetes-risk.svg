<svg viewBox="0 0 400 250" role="img" aria-label="示意图：左边一只体重理想的猫，右边一只胖猫。理想体重的猫得糖尿病的可能算 1 份，胖猫最高是 4 份" xmlns="http://www.w3.org/2000/svg">
  <text x="20" y="28" style="fill: var(--ink); font-family: var(--hand); font-size: 22px">得糖尿病的可能</text>

  <!-- 理想体重：坐着的猫，正面 -->
  <g style="fill: var(--s-todo)">
    <path d="M86 112 C76 116 78 160 82 166 L118 166 C122 160 124 116 114 112 Z" />
    <circle cx="100" cy="92" r="20" />
    <path d="M83 84 L84 62 L97 76 Z" />
    <path d="M103 76 L116 62 L117 84 Z" />
    <path d="M116 160 C136 160 140 140 132 132" style="fill: none; stroke: var(--s-todo); stroke-width: 8; stroke-linecap: round" />
  </g>
  <path d="M90 92 Q94 89 97 92 M103 92 Q106 89 110 92" style="fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round" />

  <!-- 胖猫：同样坐着，身子圆很多 -->
  <g style="fill: var(--s-todo)">
    <ellipse cx="290" cy="134" rx="54" ry="38" />
    <rect x="248" y="150" width="84" height="16" rx="6" />
    <circle cx="290" cy="90" r="22" />
    <path d="M271 82 L272 58 L286 73 Z" />
    <path d="M294 73 L308 58 L309 82 Z" />
    <path d="M340 156 C360 156 364 138 356 130" style="fill: none; stroke: var(--s-todo); stroke-width: 8; stroke-linecap: round" />
  </g>
  <path d="M279 90 Q283 87 286 90 M294 90 Q297 87 301 90" style="fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round" />

  <line x1="40" y1="166" x2="370" y2="166" style="stroke: var(--line); stroke-width: 1.5" />
  <text x="100" y="186" text-anchor="middle" style="fill: var(--ink); font-size: 14px; font-weight: 600">体重理想</text>
  <text x="290" y="186" text-anchor="middle" style="fill: var(--ink); font-size: 14px; font-weight: 600">肥胖</text>

  <!-- 风险：1 份 vs 最高 4 份 -->
  <rect x="89" y="198" width="22" height="22" rx="4" style="fill: var(--calm)" />
  <text x="100" y="240" text-anchor="middle" style="fill: var(--ink-2); font-size: 13px">1 份</text>

  <g style="fill: color-mix(in srgb, var(--pad) 50%, var(--danger))">
    <rect x="240" y="198" width="22" height="22" rx="4" />
    <rect x="266" y="198" width="22" height="22" rx="4" />
    <rect x="292" y="198" width="22" height="22" rx="4" />
    <rect x="318" y="198" width="22" height="22" rx="4" />
  </g>
  <text x="290" y="240" text-anchor="middle" style="fill: var(--ink-2); font-size: 13px">最高 4 份</text>
</svg>
